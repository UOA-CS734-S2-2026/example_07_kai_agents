# Demo controls configuration. See DEMO-CONTROLS.md.

# There is no long-running app to restart between steps: each step is a script
# you run by hand, in the terminal, and the interesting output is the trace it
# prints. So there is no DEMO_RUN_CMD and no DEMO_AFTER_STEP.
#
# What DOES need to be running is the Kai Events server, in its own terminal:
#   cd ../example_07b_kai_server_agentic && npm run dev
# Steps 02 onwards call it on localhost:3734.

# This is an example repo rather than a lab, so the tooling lives on main.
DEMO_MAIN_BRANCH="main"
